<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        /* Top Navbar */
        .navbar {
            background: #111;
            padding: 15px 40px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .title {
            font-size: 20px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Page container */
        .container {
            width: 80%;
            margin: 50px auto;
            text-align: center;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            margin: 10px;
            color: white;
        }

        .btn-blue {
            background: #2196F3;
        }
        .btn-blue:hover {
            background: #0b7dda;
        }

        .btn-green {
            background: #4CAF50;
        }
        .btn-green:hover {
            background: #3e8e41;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="title">Job Portal</div>

        <div>
            <a href="{% url 'home' %}">Home</a>

            {% if user.is_authenticated %}
                <a href="{% url 'my_jobs' %}">My Jobs</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
