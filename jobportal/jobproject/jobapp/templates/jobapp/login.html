<style>

/* Page Background */
body {
    background: #eef3f7;
    font-family: "Segoe UI", sans-serif;
}

/* Center the form container */
form {
    width: 380px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
}

/* Heading */
h2 {
    text-align: center;
    color: #0b3d4f;
    margin-top: 20px;
    font-weight: 600;
}

/* Inputs */
form input {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

/* Spacing between inputs */
form input + input {
    margin-top: 15px;
}

/* Submit Button */
form button {
    width: 100%;
    padding: 12px;
    background: #003f6b;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

form button:hover {
    background: #005c96;
}

/* Error Message */
p {
    text-align: center;
    font-size: 14px;
    margin-bottom: -10px;
}

</style>

{% extends "jobapp/base.html" %}

{% block content %}
<h2>Login</h2>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username" required>
    <br><br>

    <input type="password" name="password" placeholder="Password" required>
    <br><br>

    <button type="submit">Login</button>
</form>
{% endblock %}
