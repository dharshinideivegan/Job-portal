{% extends "jobapp/base.html" %}
{% block content %}

<style>
/* Page background */
body {
    background: #eef2f5;
    font-family: "Segoe UI", sans-serif;
}

/* Main card */
.job-card {
    width: 60%;
    margin: 40px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

/* Title */
.job-card h2 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
    color: #003c5a;
}

/* Description texts */
.job-card p {
    font-size: 18px;
    margin-bottom: 12px;
    color: #333;
}

.job-card strong {
    color: #00548f;
}

/* Back button */
.back-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 18px;
    background: #007bff;
    color: white;
    border-radius: 6px;
    text-decoration: none;
    font-size: 16px;
    transition: 0.3s;
}

.back-btn:hover {
    background: #0056b3;
}

</style>

<div class="job-card">
    <h2>{{ job.title }}</h2>

    <p><strong>Company:</strong> {{ job.employer }}</p>
    <p><strong>Salary:</strong> {{ job.salary }}</p>
    <p><strong>Description:</strong> {{ job.description }}</p>

    <a href="{% url 'all_jobs' %}" class="back-btn">Back to All Jobs</a>
</div>

{% endblock %}
